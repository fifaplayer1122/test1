<h2 mat-dialog-title>Submit Purchase Request</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" placeholder="Brief description of request" />
      <mat-error *ngIf="form.get('title')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        <mat-option *ngFor="let c of categories" [value]="c.value">{{ c.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Reason / Justification</mat-label>
      <textarea matInput formControlName="reason" rows="3" placeholder="Why is this needed?"></textarea>
      <mat-error *ngIf="form.get('reason')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Estimated Cost ($)</mat-label>
      <input matInput type="number" formControlName="cost" placeholder="0.00" min="0" />
      <mat-error *ngIf="form.get('cost')?.hasError('required')">Required</mat-error>
      <mat-error *ngIf="form.get('cost')?.hasError('min')">Must be non-negative</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        <mat-option *ngFor="let p of priorities" [value]="p.value">{{ p.label }}</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">
    Submit Request
  </button>
</mat-dialog-actions>
