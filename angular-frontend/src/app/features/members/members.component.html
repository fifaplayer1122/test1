<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold text-gray-800">Members & Roles</h1>
</div>

<!-- Add member form -->
<mat-card class="mb-6">
  <mat-card-header>
    <mat-card-title>Add New Member</mat-card-title>
  </mat-card-header>
  <mat-card-content class="pt-4">
    <form [formGroup]="addForm" class="flex gap-3 items-start flex-wrap">
      <mat-form-field appearance="outline" class="flex-1 min-w-40">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Full name" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="flex-1 min-w-52">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="user@smartdocs.ai" type="email" />
        <mat-error>Valid email required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-32">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option value="member">Member</mat-option>
          <mat-option value="admin">Admin</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-raised-button color="primary" class="mt-1" (click)="addMember()" [disabled]="addForm.invalid">
        <mat-icon>person_add</mat-icon>
        Add
      </button>
    </form>
  </mat-card-content>
</mat-card>

<!-- Members table -->
<mat-card>
  <mat-card-content>
    <div *ngIf="loading" class="flex justify-center p-8">
      <mat-spinner></mat-spinner>
    </div>

    <div *ngIf="!loading && members.length === 0" class="text-center py-12 text-gray-400">
      <mat-icon class="text-5xl">group</mat-icon>
      <p class="mt-2">No members yet.</p>
    </div>

    <table *ngIf="!loading && members.length > 0" mat-table [dataSource]="members" class="w-full">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="font-semibold">Name</th>
        <td mat-cell *matCellDef="let m">
          <div class="flex items-center gap-2">
            <mat-icon class="text-gray-400">account_circle</mat-icon>
            <span class="font-medium">{{ m.name }}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef class="font-semibold">Email</th>
        <td mat-cell *matCellDef="let m">
          <span class="text-sm text-gray-600">{{ m.email }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef class="font-semibold">Role</th>
        <td mat-cell *matCellDef="let m">
          <span [ngClass]="roleClass(m.role)" class="capitalize text-sm">{{ m.role }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let m">
          <button mat-icon-button color="warn" (click)="removeMember(m)" matTooltip="Remove member">
            <mat-icon>person_remove</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
