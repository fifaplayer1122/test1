<div class="flex flex-col h-full bg-gray-900 text-white">
  <div class="p-4 border-b border-gray-700">
    <div class="flex items-center gap-2">
      <mat-icon class="text-blue-400">bolt</mat-icon>
      <span class="font-bold text-lg text-white">SmartDocs CC</span>
    </div>
    <div class="text-xs text-gray-400 mt-1">CEO Priority Command Center</div>
  </div>

  <nav class="flex-1 overflow-y-auto py-2">
    <ng-container *ngIf="isAdmin">
      <div class="px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Admin</div>
      <a
        *ngFor="let item of adminNavItems"
        [routerLink]="item.path"
        routerLinkActive="bg-blue-700 text-white"
        class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors cursor-pointer no-underline"
      >
        <mat-icon class="text-sm">{{ item.icon }}</mat-icon>
        <span class="text-sm">{{ item.label }}</span>
      </a>
      <div class="px-4 py-2 mt-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Team</div>
    </ng-container>

    <a
      *ngFor="let item of memberNavItems"
      [routerLink]="item.path"
      routerLinkActive="bg-blue-700 text-white"
      class="flex items-center gap-3 px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition-colors cursor-pointer no-underline"
    >
      <mat-icon class="text-sm">{{ item.icon }}</mat-icon>
      <span class="text-sm">{{ item.label }}</span>
    </a>
  </nav>
</div>
