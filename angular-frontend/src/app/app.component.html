<ng-container *ngIf="!isIframe">
  <mat-sidenav-container class="h-screen">
    <mat-sidenav
      mode="side"
      [opened]="loginDisplay"
      class="w-64"
      style="background: #111827;"
    >
      <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="flex flex-col h-full bg-gray-50">
      <mat-toolbar color="primary" class="flex items-center justify-between shadow-md">
        <span class="font-semibold text-lg">{{ pageTitle }}</span>
        <div class="flex items-center gap-2" *ngIf="loginDisplay">
          <span class="text-sm opacity-80">{{ userName }}</span>
          <button mat-icon-button [matMenuTriggerFor]="userMenu">
            <mat-icon>account_circle</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu">
            <div class="px-4 py-2 text-sm text-gray-600">{{ userEmail }}</div>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </div>
      </mat-toolbar>

      <div class="flex-1 overflow-y-auto p-6">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>
